name: CI

on:
  push:
    branches: [main, master, develop, developer]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Check Drizzle migrations
        run: pnpm run db:check

      - name: Apply schema for build prerender
        run: pnpm exec drizzle-kit push --force

      - name: Build
        env:
          BETTER_AUTH_SECRET: ci-better-auth-secret-at-least-32-chars
          TICKET_SIGNING_KEY: ci-ticket-signing-key-at-least-32-chars
          SMTP_HOST: localhost
          SMTP_PORT: "2525"
          SMTP_USER: ci
          SMTP_PASS: ci
          MAIL_FROM_EMAIL: ci@example.com
          MAIL_FROM_NAME: CI
          PUSHER_APP_ID: ci
          PUSHER_SECRET: ci
          UPLOADTHING_SECRET: sk_ci
          UPSTASH_REDIS_REST_URL: https://ci.example.com
          UPSTASH_REDIS_REST_TOKEN: ci
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_PUSHER_KEY: ci
          NEXT_PUBLIC_PUSHER_CLUSTER: us2
          NEXT_PUBLIC_UPLOADTHING_APP_ID: ci
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    # Corre en schedule/manual, o en PR/push si E2E_BASE_URL está configurado.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || vars.E2E_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: pnpm run test:e2e
